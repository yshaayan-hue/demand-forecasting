<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demand Forecasting Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <h1>Demand Forecasting Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Actual Demand</h3>
                <p>{{ actual_demand }}</p>
            </div>

            <div class="card">
                <h3>Forecast Demand</h3>
                <p>{{ forecast_demand }}</p>
            </div>

            <div class="card">
                <h3>Forecast Difference</h3>
                <p>{{ forecast_difference }}</p>
            </div>

        </div>

        <section class="chart-panel">
            <h2>Demand by Region</h2>
            <div class="chart-container">
                <canvas id="demandByRegionChart" aria-label="Demand by region bar chart"></canvas>
            </div>
        </section>

    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>

</body>

</html>
